<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="badgeRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d586"/>
      <stop offset="50%" stop-color="#c49442"/>
      <stop offset="100%" stop-color="#6e4d18"/>
    </linearGradient>
    <radialGradient id="skyBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a5f82"/>
      <stop offset="100%" stop-color="#141e2e"/>
    </radialGradient>
    <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b99ab"/>
      <stop offset="100%" stop-color="#3c4654"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d8a4b"/>
      <stop offset="100%" stop-color="#284226"/>
    </linearGradient>
    <clipPath id="crestClip">
      <circle cx="64" cy="64" r="52"/>
    </clipPath>
    <filter id="sh">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#050810" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <circle cx="64" cy="64" r="58" fill="#18202c" stroke="url(#badgeRim)" stroke-width="4"/>
    <g clip-path="url(#crestClip)">
      <rect x="10" y="10" width="108" height="108" fill="url(#skyBg)"/>
      <!-- Sun / Compass Glow -->
      <circle cx="84" cy="40" r="14" fill="#ffe699" opacity="0.92"/>
      <!-- Alpine Snow-Capped Peaks -->
      <polygon points="8,98 46,38 86,98" fill="url(#mtnBack)"/>
      <polygon points="46,38 35,56 44,53 50,58 58,55" fill="#f2efe6"/>
      <polygon points="44,98 84,46 122,98" fill="#4f5c6e"/>
      <polygon points="84,46 74,61 82,58 88,62 94,59" fill="#f2efe6"/>
      <!-- Rolling Green Pine Foothills -->
      <path d="M10 88 Q42 74 72 86 T120 82 L120 120 L10 120 Z" fill="url(#mtnFront)"/>
      <!-- Winding Sand Trail -->
      <path d="M54 118 Q62 100 56 90 Q52 84 62 78" fill="none" stroke="#dfc796" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle cx="64" cy="64" r="52" fill="none" stroke="url(#badgeRim)" stroke-width="2.2"/>
    <!-- Cardinal Compass Diamonds -->
    <polygon points="64,2 69,9 64,15 59,9" fill="url(#badgeRim)"/>
    <polygon points="64,113 69,119 64,126 59,119" fill="url(#badgeRim)"/>
    <polygon points="2,64 9,59 15,64 9,69" fill="url(#badgeRim)"/>
    <polygon points="113,64 119,59 126,64 119,69" fill="url(#badgeRim)"/>
  </g>
</svg>
