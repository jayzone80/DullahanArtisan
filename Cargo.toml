[package]
name = "dullahan-artisan"
version = "0.1.0"
edition = "2021"
description = "Dullahan Artisan — headless, zero-dependency LLM-native game-asset compiler for 3D PBR models (CSG/metaballs), eroded terrains, procedural SFX/music, and 2D Game-UI SVGs"

[lib]
name = "dullahan_artisan"
path = "src/lib.rs"

[[bin]]
name = "artisan"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
